        fill="url(#brillo)"/>

  <!-- separación de los dos botones -->
  <path d="M32 5.5v18" stroke="#0d3d5e" stroke-opacity=".45" stroke-width="2.4"
        stroke-linecap="round" fill="none"/>
  <path d="M14.6 23.5h34.8" stroke="#0d3d5e" stroke-opacity=".35" stroke-width="2"
        fill="none"/>

  <!-- rueda -->
  <rect x="28.6" y="10" width="6.8" height="12" rx="3.4" fill="#0d3d5e" fill-opacity=".55"/>
  <rect x="29.8" y="11.4" width="4.4" height="9.2" rx="2.2" fill="#eaf6ff" fill-opacity=".85"/>

  <!-- destello del sensor -->
