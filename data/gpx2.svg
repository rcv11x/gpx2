<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aa8d8"/>
      <stop offset="100%" stop-color="#1d6fa5"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- silueta del ratón -->
  <path d="M32 4c11 0 18 7.6 18 18v20c0 11-8 18-18 18s-18-7-18-18V22C14 11.6 21 4 32 4z"
        fill="url(#cuerpo)"/>
